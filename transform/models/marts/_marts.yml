version: 2

models:
  - name: dim_date
    description: >
      Dimensión Fecha (calendario). Una fila por día.
      Incluye una fila "desconocido" (date_key = -1) para hechos sin fecha.
    columns:
      - name: date_key
        description: "Llave única de la fecha (YYYYMMDD). -1 = desconocido."
        data_tests:
          - unique
          - not_null
      - name: day_type
        description: "'Entre semana' | 'Fin de semana' | 'N/A'."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entre semana', 'Fin de semana', 'N/A']

  - name: dim_product
    description: >
      Dimensión Producto conformada. Una fila por producto desnormalizando
      categoría, subcategoría, departamento y unidad de medida.
      Incluye una fila desconocido (product_key = '-1').
    columns:
      - name: product_key
        description: "Llave subrogada única generada por dbt_utils."
        data_tests:
          - unique
          - not_null
      - name: product_id
        description: "Llave de negocio natural del OLTP."
        data_tests:
          - not_null
      - name: is_discontinued
        description: "Estado de discontinuidad: 'Sí', 'No' o 'N/A'."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Sí', 'No', 'N/A']

  - name: dim_employee
    description: >
      Dimensión Empleado conformada (SCD2). Una fila por empleado,
      con geografía aplanada y organigrama resuelto mediante self-join.
      Incluye una fila desconocido (employee_key = '-1').
    columns:
      - name: employee_key
        description: "Llave subrogada única generada por dbt_utils."
        data_tests:
          - unique
          - not_null
      - name: employee_id
        description: "Llave de negocio natural del OLTP."
        data_tests:
          - not_null

  - name: dim_location
    description: >
      Dimensión Conforme de Localización Geográfica (SCD2).
      Una fila por dirección, aplanando ciudad, provincia, país y continente.
      Incluye una fila desconocido (location_key = '-1').
    columns:
      - name: location_key
        description: "Llave subrogada única generada por dbt_utils."
        data_tests:
          - unique
          - not_null
      - name: address_id
        description: "Llave de negocio natural del OLTP."
        data_tests:
          - not_null
